name: Build Hibiscus IPA

on:
  workflow_dispatch
  
jobs: 
    build：
        runs-on: macos-26
        
    steps:
      - name: Checkout
          uses: actions/checkout@v4

      - name: Select Xcode
          run:
            sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer

       - name: Build
         run: |
         xcodebuild\
         -project Hibiscus.xcodeproj\
         -scheme Hibiscus\
         -configuration Debug
